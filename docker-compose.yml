services:
  postgres:
    image: postgres:17-alpine
    container_name: meridian-commerce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meridian_commerce
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_local_dev
    ports:
      - "5432:5432"
    volumes:
      - meridian_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian_commerce"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  meridian_postgres_data:
